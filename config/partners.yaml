# GJH INC partner Gmail-label allowlist.
#
# EXACT label match only, case-sensitive, no substrings, no renames.
# gmail_ingest.py refuses to fetch any label not listed here -- there
# is no code path that can request an arbitrary label, and no
# in:anywhere/in:all query is ever used anywhere in this project.
#
# Parsed by partners.py's own small parser (not a general YAML lib --
# see that module's docstring for why). Keep this exact shape: a
# top-level `partners:` key, then `- id: <slug>` / `label: "<exact
# Gmail label name>"` pairs, one per partner.
#
# Operator-confirmed (2026-09-30, via `cli.py list-labels` against the
# real mailbox) -- note carahsoft/zireh have NO ".com" suffix, unlike
# the others; that's the real confirmed label text, not a typo, so it
# stays exactly as given rather than being "corrected" to match the
# other entries' pattern.
#
# Never add the bare parent "Archive_" label, or anything under
# LinkedIn/news -- this allowlist is partner correspondence only, not
# a general archive sweep. Adding a label here always means a specific,
# confirmed (or explicitly-flagged-unconfirmed) partner, never a parent
# category or an unrelated personal/news label that happens to exist.
#
# Wave 1 (below, operator-confirmed via list-labels) first, always --
# Wave 2 (further down, translated/unconfirmed) stays after it.
partners:
  # --- Wave 1: confirmed via list-labels ---
  - id: omnissa
    label: "Archive_/@omnissa.com"
  - id: microsoft
    label: "Archive_/@microsoft.com"
  - id: barracuda
    label: "Archive_/@barracuda.com"
  - id: tdsynnex
    label: "Archive_/@tdsynnex.com"
  - id: arrow
    label: "Archive_/@arrow.com"
  - id: carahsoft
    label: "Archive_/@carahsoft"
  - id: planetbids
    label: "Archive_/@planetbids.com"
  - id: zireh
    label: "Archive_/@zireh"

  # --- Wave 2: translated from Gmail search-box syntax, unconfirmed ---
  # Given as Gmail SEARCH-BOX syntax ("label:archive_-@google.com", ...),
  # not raw list-labels output -- Gmail's search suggestions render a
  # nested label's "/" as "-" for display, but the underlying label
  # NAME (what list-labels prints, what resolve_label matches exactly)
  # still uses "/". Translated here to match the established
  # "Archive_/@<domain>" pattern the other six confirmed entries share.
  # NOT independently re-confirmed via list-labels -- if any of these
  # doesn't actually match, it just shows up as a non-fatal
  # skipped_partners entry next run (see gmail_ingest.py), never a
  # wrong fetch. nvidia is back (previously dropped only because it
  # wasn't on the prior confirmed list; now explicitly given again).
  - id: google
    label: "Archive_/@google.com"
  - id: zoom
    label: "Archive_/@zoom.us"
  - id: zoho
    label: "Archive_/@zohocorp.com"
  - id: verizon
    label: "Archive_/@verizon.com"
  - id: udemy
    label: "Archive_/@udemy.com"
  - id: salesforce
    label: "Archive_/@salesforce.com"
  - id: nvidia
    label: "Archive_/@nvidia.com"
